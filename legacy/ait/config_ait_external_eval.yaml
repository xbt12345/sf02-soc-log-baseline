paths:
  train_path: ./data/train.parquet
  predict_path: ./data/valid_input.parquet
  artifacts_dir: ./artifacts

features:
  id_col: event_id
  label_col: label_binary
  text_cols:
    - message_sanitized
  categorical_cols:
    - pipeline
    - src_ip
    - dst_ip
    - src_port
    - src_host
    - dst_host
    - username
    - product_name
    - vendor_name
  numeric_cols: []
  datetime_cols:
    - timestamp
  entity_cols:
    - src_host
    - src_ip
    - username
    - dst_ip
  drop_cols: []

split:
  primary_strategy: group_by:src_ip
  comparison_strategies:
    - group_by:src_ip
  val_size: 0.1
  test_size: 0.1
  random_seed: 42
  num_runs: 1

model:
  iterations: 300
  depth: 8
  learning_rate: 0.1
  l2_leaf_reg: 3.0
  random_seed: 42
  verbose: 100

runtime:
  compare_random_split: false
