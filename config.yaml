paths:
  raw_zip_path: C:/Users/xiabutian/Downloads/data.zip
  extracted_dir: C:/Users/xiabutian/sf02_data/data
  train_path: C:/Users/xiabutian/sf02_data/data/train.parquet
  predict_path: C:/Users/xiabutian/sf02_data/data/valid_input.parquet
  artifacts_dir: ./artifacts

features:
  id_col: event_id
  label_col: label_binary
  text_cols:
    - message_sanitized
  categorical_cols:
    - pipeline
    - src_ip
    - dst_ip
    - src_port
    - src_host
    - dst_host
    - username
    - product_name
    - vendor_name
  numeric_cols: []
  datetime_cols:
    - timestamp
  entity_cols:
    - src_host
    - src_ip
    - username
    - dst_ip
  drop_cols: []

split:
  primary_strategy: stratified_group
  comparison_strategies:
    - stratified_group
    - stratified_random
    - chronological
  val_size: 0.1
  test_size: 0.1
  random_seed: 42
  num_runs: 3

model:
  iterations: 300
  depth: 8
  learning_rate: 0.1
  l2_leaf_reg: 3.0
  random_seed: 42
  verbose: 100

runtime:
  compare_random_split: false
